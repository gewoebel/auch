<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b0d">
  <meta name="description" content="Auch – das Gesellschaftsspiel für gleiche Antworten.">
  <title>Auch</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Zum Inhalt</a>
  <div id="offline-banner" class="offline-banner" hidden>Keine Verbindung – Verbindung wird wiederhergestellt …</div>
  <header class="topbar">
    <button id="brand-home" class="brand" type="button" aria-label="Zur Startseite">
      <svg class="brand-mark" viewBox="0 0 48 48" role="img" aria-label="Auch">
        <path d="M10 38 21 10h6l11 28h-7l-2.1-6H18.8l-2.1 6H10Zm11-12h5.8L24 17.8 21 26Z" fill="currentColor"/>
        <circle cx="37" cy="11" r="5" fill="#FFCB03"/>
      </svg>
      <span>Auch</span>
    </button>
    <div class="topbar-meta">
      <span id="room-pill" class="room-pill" hidden>Code <strong id="room-code-small">–</strong></span>
      <span id="connection-dot" class="connection-dot" aria-label="Verbindungsstatus"></span>
    </div>
  </header>

  <main id="app" class="app-shell" tabindex="-1" aria-live="polite">
    <noscript>Für „Auch“ muss JavaScript aktiviert sein.</noscript>
    <section class="screen loading-screen">
      <div class="loader" aria-hidden="true"></div>
      <p>Spiel wird geladen …</p>
    </section>
  </main>

  <div id="modal-root"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <template id="home-template">
    <section class="screen home-screen">
      <div class="intro-mark" aria-hidden="true">
        <span>A</span><span>U</span><span>C</span><span>H</span>
      </div>
      <div class="hero-copy">
        <p class="eyebrow">Gleich gedacht?</p>
        <h1>Auch</h1>
        <p>Antworte schnell. Vergleicht eure Antworten. Gleiche Gedanken geben Punkte.</p>
      </div>
      <div class="action-stack">
        <button class="button button-primary" data-action="show-create">Spiel starten</button>
        <button class="button button-secondary" data-action="show-join">Spiel beitreten</button>
      </div>
      <button class="text-button" data-action="show-rules">So funktioniert’s</button>
      <p id="setup-note" class="setup-note" hidden></p>
    </section>
  </template>

  <template id="name-template">
    <section class="screen form-screen">
      <button class="back-button" data-action="home" aria-label="Zurück">←</button>
      <div>
        <p class="eyebrow" id="form-eyebrow">Neues Spiel</p>
        <h1 id="form-title">Wie heißt du?</h1>
      </div>
      <form id="entry-form" class="entry-form" novalidate>
        <div id="code-field" class="field" hidden>
          <label for="room-code">Spielcode</label>
          <input id="room-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" maxlength="4" placeholder="0000">
        </div>
        <div class="field">
          <label for="player-name">Dein Name</label>
          <input id="player-name" name="name" autocomplete="nickname" maxlength="24" placeholder="Name" required>
        </div>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button class="button button-primary" type="submit">Weiter</button>
      </form>
    </section>
  </template>

  <template id="lobby-template">
    <section class="screen lobby-screen">
      <div class="room-code-block">
        <p class="eyebrow">Spielcode</p>
        <button id="copy-code" class="big-code" aria-label="Spielcode kopieren">0000</button>
        <p>Gib diesen Code an deine Mitspieler weiter.</p>
      </div>
      <div class="section-heading">
        <h1>Warteraum</h1>
        <span id="player-count" class="count-badge">1 / 8</span>
      </div>
      <ul id="lobby-list" class="player-list" aria-label="Mitspieler"></ul>
      <div id="lobby-actions" class="sticky-actions"></div>
    </section>
  </template>

  <template id="round-template">
    <section class="screen round-screen">
      <div class="round-meta">
        <span id="round-label">Runde 1</span>
        <div id="timer" class="timer" aria-label="Verbleibende Zeit"><span>5</span></div>
      </div>
      <article class="question-card">
        <p class="eyebrow">Eure Aussage</p>
        <h1 id="question-text"></h1>
      </article>
      <div id="round-content" class="round-content"></div>
    </section>
  </template>

  <template id="scoring-template">
    <section class="screen scoring-screen">
      <div>
        <p class="eyebrow">Punkte vergeben</p>
        <h1>Wer dachte gleich?</h1>
        <p>Markiere alle Personen mit passenden Antworten.</p>
      </div>
      <form id="scoring-form">
        <ul id="answer-list" class="answer-list"></ul>
        <p id="scoring-warning" class="form-error" role="alert" hidden></p>
        <div class="sticky-actions">
          <button class="button button-primary" type="submit">Auswahl bestätigen</button>
        </div>
      </form>
    </section>
  </template>

  <template id="results-template">
    <section class="screen results-screen">
      <div>
        <p class="eyebrow">Zwischenstand</p>
        <h1 id="result-title">Punktestand</h1>
      </div>
      <ol id="leaderboard" class="leaderboard"></ol>
      <div id="result-actions" class="sticky-actions"></div>
    </section>
  </template>

  <template id="ended-template">
    <section class="screen ended-screen">
      <p class="eyebrow">Spiel beendet</p>
      <h1>Das war’s.</h1>
      <p id="winner-copy" class="winner-copy"></p>
      <ol id="final-leaderboard" class="leaderboard"></ol>
      <div id="ended-actions" class="sticky-actions"></div>
    </section>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
